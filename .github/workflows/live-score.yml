name: Live score

# Hourly. Refreshes the Main Page card and the score ticker for every Clemson
# varsity sport. If a game is live or about to start, the job keeps running and
# polls every 2 minutes until nothing is live.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

concurrency:
  group: live-score
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python live_score_bot.py update
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          WIKI_API_URL: ${{ secrets.WIKI_API_URL }}
          WIKI_BOT_USER: ${{ secrets.WIKI_BOT_USER }}
          WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD }}
          WIKI_BOT_UA: ${{ secrets.WIKI_BOT_UA }}
          POLL_SECONDS: "120"
